<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="../shared/theme.js"></script>
  <title>Backlog Monitor</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <style>
    /* Hallmark · genre: modern-minimal · macrostructure: Workbench (app) · page: popup companion · design-system: design.md · designed-as-app */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button, select { font-family: inherit; }

    body {
      width: 320px;
      font-family: var(--font-body); font-size: var(--text-md); line-height: 1.45;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Account header ── */
    .head {
      display: flex; align-items: center; gap: var(--space-sm);
      padding: var(--space-md) var(--space-md) var(--space-sm);
    }
    .head .avatar { width: 32px; height: 32px; font-size: var(--text-xs); }
    .head .who { flex: 1; min-width: 0; }
    .head .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .head .sub  { font: var(--text-xs) var(--font-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .head .sub a { color: var(--accent); font-family: var(--font-body); font-weight: 600; text-decoration: none; }
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
      width: 30px; height: 30px; border-radius: var(--radius-md);
      background: none; border: 1px solid transparent; color: var(--muted); cursor: pointer;
      transition: background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out);
    }
    .icon-btn:hover { background: var(--surface2); color: var(--text); }
    .icon-btn:active { background: var(--overlay); }
    .icon-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

    .card {
      margin: 0 var(--space-md) var(--space-sm); padding: var(--space-sm);
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-xs); margin-bottom: var(--space-xs); }
    .card-title { font-size: var(--text-sm); font-weight: 600; color: var(--text); }

    /* ── Log-time task ── */
    .task[hidden] { display: none; }
    .task { background: var(--miss-bg); border-color: var(--border2); border-left: 3px solid var(--red); }
    .task-item { display: flex; align-items: flex-start; gap: var(--space-xs); padding: var(--space-2xs) 0; }
    .task-item + .task-item { border-top: 1px solid var(--border); }
    .task-item .body { flex: 1; min-width: 0; font-size: var(--text-sm); }
    .task-item .due  { color: var(--red); font-weight: 600; }
    .task-item .hint { color: var(--text2); font-size: var(--text-xs); margin-top: 1px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2xs);
      height: 28px; padding: 0 var(--space-sm); border-radius: var(--radius-md); white-space: nowrap;
      font-size: var(--text-sm); font-weight: 500; cursor: pointer;
      background: var(--surface2); color: var(--text); border: 1px solid var(--border2);
      transition: background-color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out);
    }
    .btn:hover:not(:disabled) { background: var(--overlay); border-color: var(--subtle); }
    .btn:active:not(:disabled) { background: var(--border2); }
    .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .btn:disabled { background: var(--disabled-bg); color: var(--muted); cursor: not-allowed; }
    .btn.primary { background: var(--accent2); color: var(--on-accent); border-color: var(--accent2); font-weight: 600; }
    .btn.primary:hover:not(:disabled) { background: var(--accent2-hover); border-color: var(--accent2-hover); }

    /* ── My time ── */
    .mt-head select {
      height: 26px; max-width: 180px; padding: 0 var(--space-2xs); border-radius: var(--radius-sm);
      background: var(--bg); color: var(--text); border: 1px solid var(--border2);
      font-size: var(--text-xs); cursor: pointer; color-scheme: var(--scheme);
    }
    .mt-head select:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    .mt-head select option { background: var(--bg); color: var(--text); }
    .mt-head select option.current { color: var(--accent); }
    .mt-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--space-2xs); }
    .mt-day {
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      padding: var(--space-2xs) 0; border-radius: var(--radius-md);
      border: 1px solid var(--surface2); background: var(--bg);
    }
    .mt-day .d { font-size: var(--text-2xs); color: var(--muted); white-space: nowrap; }
    .mt-day b  { font: 500 var(--text-sm) var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text); }
    .mt-day.under b { color: var(--warn); }
    .mt-day.miss  { background: var(--miss-bg); }
    .mt-day.miss b { color: var(--red); }
    .mt-day.met   { background: var(--met-bg); }
    .mt-day.over  { background: var(--over-bg); }
    .mt-day.over b { color: var(--over); }
    .mt-day.future b { color: var(--border2); font-weight: 400; }
    .mt-day.today { border-color: var(--accent); }
    .mt-summary { margin-top: var(--space-xs); font-size: var(--text-xs); color: var(--text2); }
    .mt-summary strong { font-family: var(--font-mono); color: var(--text); font-weight: 500; }
    .mt-msg { grid-column: 1 / -1; font-size: var(--text-xs); color: var(--muted); text-align: center; padding: var(--space-xs) 0; }
    .mt-msg a { color: var(--accent); font-weight: 600; text-decoration: none; }

    /* ── Burndown ── */
    .burndown[hidden] { display: none; }
    .sync-line { display: flex; align-items: center; gap: var(--space-2xs); font-size: var(--text-xs); color: var(--muted); }
    .sync-line .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .sync-line.ok .dot { background: var(--green); }
    .sync-line.error .dot { background: var(--red); }
    .sync-line.syncing .dot { background: var(--accent); animation: pulse .9s var(--ease-in-out) infinite; }
    @keyframes pulse { 50% { opacity: .3; } }
    .versions { list-style: none; display: flex; flex-direction: column; margin-bottom: var(--space-sm); }
    .versions li { display: flex; align-items: center; gap: var(--space-xs); padding: var(--space-2xs) 0; font-size: var(--text-sm); }
    .versions li + li { border-top: 1px solid var(--border); }
    .versions .vname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .versions .tag { font-size: var(--text-2xs); font-weight: 600; padding: 1px var(--space-xs); border-radius: var(--radius-pill); white-space: nowrap; }
    .versions .tag.ok   { background: var(--green-tag-bg); color: var(--green); }
    .versions .tag.warn { background: var(--orange-tag-bg); color: var(--orange); }
    .versions .empty { color: var(--muted); }
    .versions .empty a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .bd-actions { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-xs); }

    /* ── Dashboard nav ── */
    .nav {
      display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--space-2xs);
      padding: var(--space-xs) var(--space-md) var(--space-md);
      border-top: 1px solid var(--border); margin-top: var(--space-2xs);
    }
    .nav button {
      display: flex; flex-direction: column; align-items: center; gap: var(--space-2xs);
      padding: var(--space-xs) var(--space-2xs); border-radius: var(--radius-md);
      background: none; border: 1px solid transparent; color: var(--text2); cursor: pointer;
      font-size: var(--text-xs); font-weight: 500; white-space: nowrap;
      transition: background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out);
    }
    .nav button[hidden] { display: none; }
    .nav button svg { color: var(--muted); }
    .nav button:hover { background: var(--surface); color: var(--text); }
    .nav button:hover svg { color: var(--accent); }
    .nav button:active { background: var(--surface2); }
    .nav button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

    @media (prefers-reduced-motion: reduce) {
      .sync-line.syncing .dot { animation: none; }
      .btn, .icon-btn, .nav button { transition-duration: 0s; }
    }
  </style>
</head>
<body>
  <header class="head">
    <span class="avatar" id="me-avatar" aria-hidden="true"></span>
    <div class="who">
      <div class="name" id="me-name">Backlog Monitor</div>
      <div class="sub" id="me-sub">&nbsp;</div>
    </div>
    <button class="icon-btn" id="btn-settings" aria-label="Quick settings" title="Quick settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>
      </svg>
    </button>
  </header>

  <section id="task-card" class="card task" hidden aria-live="polite"></section>

  <section class="card mytime" aria-labelledby="mt-label">
    <div class="card-head mt-head">
      <h2 class="card-title" id="mt-label">My time</h2>
      <select id="mt-sprint" aria-label="Sprint" disabled><option>Loading…</option></select>
    </div>
    <div id="mt-grid" class="mt-grid"></div>
    <div id="mt-summary" class="mt-summary" aria-live="polite"></div>
  </section>

  <section class="card burndown" id="burndown-card" aria-labelledby="bd-label" hidden>
    <div class="card-head">
      <h2 class="card-title" id="bd-label">Burndown</h2>
      <div class="sync-line" id="sync-status" aria-live="polite"></div>
    </div>
    <ul class="versions" id="backlog-list"><li class="empty">Loading…</li></ul>
    <div class="bd-actions">
      <button class="btn" id="btn-sync">Sync now</button>
      <button class="btn primary" id="btn-copy-charts" disabled>Copy charts</button>
    </div>
  </section>

  <nav class="nav" aria-label="Dashboard">
    <button data-open="viewer.html" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 7l4 4 3-2 5 6"/></svg>
      Burndown
    </button>
    <button data-open="timelog.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M12 13v3l2 1"/></svg>
      Time log
    </button>
    <button data-open="planning.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
      Planning
    </button>
  </nav>

  <script type="module" src="popup.js"></script>
</body>
</html>

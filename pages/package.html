<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="../shared/theme.js"></script>
  <script src="../shared/rail-prefs.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Package · Backlog Monitor</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/shell.css" />
  <style>
    /* Hallmark · genre: modern-minimal · macrostructure: Workbench (app) · page: Package (release pipeline tracker) · design-system: design.md · designed-as-app */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; font-size: var(--text-md); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    [hidden] { display: none !important; }
    .muted { color: var(--muted); }

    #page { max-width: 1200px; margin: 0 auto; padding: var(--space-lg) var(--space-xl) var(--space-2xl); }

    .ctrl {
      background: var(--overlay); color: var(--text); border: 1px solid var(--border2);
      border-radius: var(--radius-sm); padding: 4px 9px; font: inherit; font-size: var(--text-sm); height: 30px;
      color-scheme: var(--scheme); max-width: 100%;
    }
    select.ctrl { cursor: pointer; }
    .ctrl:hover:not(:disabled) { border-color: var(--subtle); }
    .ctrl:focus-visible { border-color: var(--focus); }

    button {
      height: 30px; padding: 0 13px; border-radius: var(--radius-md); font: inherit; font-size: var(--text-sm); font-weight: 600;
      cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface2); color: var(--text); border: 1px solid var(--border2);
      transition: background-color var(--dur-short) var(--ease-out), transform var(--dur-short) var(--ease-out);
    }
    button:hover:not(:disabled)  { background: var(--overlay); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: var(--accent2); color: var(--on-accent); border-color: var(--accent2); }
    button.primary:hover:not(:disabled) { background: var(--accent2-hover); }
    button.ghost { background: none; border-color: transparent; color: var(--text2); }
    button.ghost:hover:not(:disabled) { background: var(--surface2); color: var(--text); }

    .list-head { display: flex; align-items: center; gap: var(--space-sm); margin-bottom: var(--space-md); }
    .list-head h2 { font-size: var(--text-lg); font-weight: 650; letter-spacing: -0.01em; }
    .list-head .primary { margin-inline-start: auto; }

    .all-group { list-style: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
    .all-row {
      width: 100%; height: auto; min-height: 52px; display: grid; grid-template-columns: 76px minmax(0, 1fr) 120px;
      gap: var(--space-sm); align-items: center; text-align: left; font-weight: 400;
      background: none; border: none; border-bottom: 1px solid var(--border); border-radius: 0; padding: 9px var(--space-md); white-space: normal;
      transition: background-color var(--dur-short) var(--ease-out);
    }
    .all-group li:last-child .all-row { border-bottom: none; }
    .all-row:hover:not(:disabled) { background: var(--surface2); }
    .all-row .a-main { min-width: 0; display: grid; gap: 2px; }
    .all-row .a-subject { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .all-row .a-meta { color: var(--text2); font-size: var(--text-xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .a-progress { display: flex; align-items: center; gap: var(--space-xs); justify-content: flex-end; }
    .pkg-bar { display: inline-block; width: 64px; height: 6px; border-radius: 999px; background: var(--border2); overflow: hidden; }
    .pkg-bar-fill { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width var(--dur-med) var(--ease-out); }
    .pkg-bar.done .pkg-bar-fill { background: var(--green); }
    .pkg-progress-row { display: flex; align-items: center; gap: var(--space-sm); margin-bottom: var(--space-sm); }
    .pkg-progress-row .pkg-bar { width: 100%; max-width: 420px; height: 8px; }
    .empty-state {
      display: grid; justify-items: center; gap: 4px; padding: var(--space-2xl) var(--space-lg); color: var(--muted);
      background: var(--surface); border: 1px dashed var(--border2); border-radius: var(--radius-lg);
    }
    .empty-state svg { margin-bottom: var(--space-xs); opacity: .7; }
    .empty-state p { font-size: var(--text-sm); }
    .empty-state p:first-of-type { color: var(--text); font-weight: 600; font-size: var(--text-md); }

    .pkg-detail-body { display: grid; grid-template-columns: minmax(0, 1fr) var(--pkg-side-w, 260px); gap: var(--space-md); align-items: start; }
    .pkg-detail-body.side-collapsed { grid-template-columns: minmax(0, 1fr) auto; }
    @media (max-width: 860px) { .pkg-detail-body { grid-template-columns: 1fr !important; } .pkg-side-handle { display: none; } }
    .pkg-side {
      position: sticky; top: var(--space-md); background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: var(--space-md); display: grid; gap: var(--space-xs);
      max-height: calc(100vh - 220px); overflow: auto; overflow-x: hidden;
    }
    .pkg-side.collapsed { padding: var(--space-sm) 6px; justify-items: center; }
    .pkg-side-handle {
      position: absolute; left: -5px; top: 0; bottom: 0; width: 10px; cursor: ew-resize; touch-action: none;
    }
    .pkg-side-head { display: flex; align-items: baseline; gap: 6px; }
    .pkg-side-head .spacer { flex: 1; }
    .pkg-side h3 { font-size: var(--text-sm); font-weight: 650; display: flex; align-items: baseline; gap: 6px; }
    .pkg-side .ghost:not(.icon-btn) { width: 100%; justify-content: center; margin-top: var(--space-xs); }
    .icon-btn { width: 26px; height: 26px; padding: 0; justify-content: center; font-size: var(--text-sm); flex-shrink: 0; }
    .icon-btn.spinning { animation: pkg-spin 900ms linear infinite; }
    @keyframes pkg-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .icon-btn.spinning { animation: none; } }
    .dep-rows { list-style: none; display: grid; gap: 2px; font-size: var(--text-xs); }
    .dep-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; border-bottom: 1px solid var(--border); }
    .dep-row:last-child { border-bottom: none; }
    .dep-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dep-dot { width: 16px; text-align: center; font-weight: 700; flex-shrink: 0; }
    .dep-dot.ok  { color: var(--green); }
    .dep-dot.bad { color: var(--red); }
    .dep-dot.unk { color: var(--muted); }
    .dep-legend { font-size: var(--text-2xs); }
    .chip {
      display: inline-flex; align-items: center; gap: 3px; justify-self: start;
      font-size: var(--text-2xs); font-weight: 650; text-transform: uppercase; letter-spacing: .03em;
      padding: 2px 7px; border-radius: var(--radius-sm); border: 1px solid var(--border2); color: var(--text2);
    }
    .chip.plan { color: var(--green); border-color: var(--green); background: var(--met-bg); }
    .chip.now  { color: var(--accent); border-color: var(--accent); background: var(--accent-bg); }
    .chip.done { color: var(--green); border-color: var(--green); background: var(--met-bg); }
    .chip.in_progress { color: var(--accent); border-color: var(--accent); background: var(--accent-bg); }
    .chip.todo { color: var(--muted); }

    .pkg-detail .list-head h2 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .pkg-canvas-toolbar { display: flex; align-items: center; gap: var(--space-xs); margin-bottom: var(--space-sm); }
    .pkg-canvas-toolbar .spacer { flex: 1; }
    .pkg-canvas {
      position: relative; overflow: auto; max-height: calc(100vh - 220px);
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    }
    .pkg-edges { position: absolute; top: 0; left: 0; pointer-events: none; }
    .pkg-edges [data-act="edge-chip"] { pointer-events: auto; }
    .pkg-edge.edge-done { stroke: var(--green); }
    .pkg-edge.edge-now  { stroke: var(--accent); stroke-dasharray: 5 4; animation: pkg-flow 900ms linear infinite; }
    .pkg-edge.edge-muted { stroke: var(--border2); }
    @keyframes pkg-flow { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) { .pkg-edge.edge-now { animation: none; } }

    .pkg-node {
      position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; text-align: center; padding: 7px 12px; border-radius: var(--radius-md); overflow: hidden;
      background: var(--surface2); color: var(--text); border: 1px solid var(--border2);
      font-size: var(--text-sm); font-weight: 600; user-select: none;
      box-shadow: 0 1px 2px var(--shadow); transition: box-shadow var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out);
    }
    .pkg-node:not(.locked):hover { box-shadow: 0 4px 14px var(--shadow); }
    .pkg-node.kind-decision {
      clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); border-radius: 0;
      padding: 7px 36px; font-size: var(--text-xs);
      background: var(--overlay); border-color: var(--subtle); border-width: 1.5px;
    }
    .pkg-node.kind-decision .pkg-node-label { -webkit-line-clamp: 3; }
    .pkg-node.kind-decision.done { background: var(--met-bg); border-color: var(--green); }
    .pkg-node.kind-decision.now  { background: var(--accent-bg); border-color: var(--accent); }
    .pkg-node.kind-decision.locked { background: var(--surface2); }
    .pkg-node.done { border-color: var(--green); color: var(--text2); background: var(--met-bg); }
    .pkg-node.now {
      border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 4px 16px var(--accent-bg);
      background: var(--accent-bg); color: var(--text);
    }
    .pkg-node.locked { color: var(--muted); background: var(--surface); }
    .pkg-node.locked .pkg-icon { opacity: .55; }
    .pkg-node-kind { color: var(--text2); }
    .pkg-node.now .pkg-node-kind, .pkg-node.done .pkg-node-kind { color: currentColor; }
    .pkg-node-label {
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
      line-height: 1.25; word-break: break-word;
    }
    .pkg-node-status {
      position: absolute; top: -7px; left: -7px; width: 16px; height: 16px; border-radius: 50%;
      background: var(--green); color: var(--on-accent); display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--surface);
    }
    .pkg-node-pulse {
      position: absolute; top: -5px; left: -5px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 0 0 var(--accent-bg); animation: pkg-pulse 1.6s var(--ease-out) infinite;
    }
    @keyframes pkg-pulse { 0% { box-shadow: 0 0 0 0 rgb(76 125 255 / .5); } 100% { box-shadow: 0 0 0 9px rgb(76 125 255 / 0); } }
    @media (prefers-reduced-motion: reduce) { .pkg-node-pulse { animation: none; } }
    .pkg-node-badges { display: flex; align-items: center; gap: 7px; font-size: var(--text-2xs); color: var(--text2); font-weight: 650; }
    .pkg-node-badges .pkg-node-badge { display: inline-flex; align-items: center; gap: 2px; }
    .pkg-icon { flex-shrink: 0; }
    .pkg-node-rename { width: 100%; font: inherit; text-align: center; background: var(--overlay); color: var(--text); border: 1px solid var(--accent); border-radius: var(--radius-sm); }
    .pkg-node-del {
      position: absolute; top: -8px; right: -8px; width: 18px; height: 18px; padding: 0; min-height: 0;
      border-radius: 50%; font-size: 10px; display: none; align-items: center; justify-content: center;
      background: var(--surface); border: 1px solid var(--border2); color: var(--text2);
    }
    .pkg-node:hover .pkg-node-del { display: inline-flex; }
    .pkg-node-handle {
      position: absolute; bottom: -6px; right: -6px; width: 12px; height: 12px; border-radius: 50%;
      background: var(--accent); border: 2px solid var(--surface); cursor: crosshair;
    }

    dialog.step-dlg {
      width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); margin: auto; padding: 0;
      background: var(--surface); color: var(--text); border: 1px solid var(--border2); border-radius: var(--radius-lg);
      box-shadow: 0 12px 40px var(--shadow); overflow: hidden;
    }
    dialog.step-dlg::backdrop { background: rgb(0 0 0 / .55); }
    .step-form { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; max-height: calc(100dvh - 32px); }
    .cl-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm); padding: var(--space-sm) var(--space-lg); border-bottom: 1px solid var(--border); font-size: var(--text-sm); }
    .step-body { display: grid; gap: var(--space-sm); padding: var(--space-lg); overflow-y: auto; }
    .card-actions { display: flex; gap: var(--space-xs); }
    .cl-foot { display: flex; align-items: center; gap: var(--space-xs); padding: var(--space-sm) var(--space-lg); border-top: 1px solid var(--border); }
    .cl-foot .spacer { flex: 1; }
    .dlg-fld { display: grid; gap: 4px; min-width: 0; }
    .dlg-fld > span { font-size: var(--text-xs); color: var(--muted); font-weight: 500; }
    .dlg-fld .ctrl { width: 100%; }

    .step-tasks { display: grid; gap: var(--space-xs); border-top: 1px solid var(--border); padding-top: var(--space-sm); }
    .step-tasks h3 { font-size: var(--text-sm); font-weight: 650; }
    .task-list { list-style: none; display: grid; gap: var(--space-2xs); }
    .task-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: var(--space-xs); align-items: center; font-size: var(--text-sm); }
    .task-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .add-task { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto auto; gap: var(--space-xs); align-items: center; padding-top: var(--space-xs); }
    .pkg-facts { font-size: var(--text-sm); margin-bottom: var(--space-sm); }
    .step-when { font-size: var(--text-sm); color: var(--text2); background: var(--surface2); border-radius: var(--radius-sm); padding: 6px var(--space-sm); }
    .step-gate { display: grid; gap: var(--space-2xs); }
    .gate { font-size: var(--text-sm); border-inline-start: 3px solid var(--border2); padding: 4px var(--space-sm); }
    .gate.ok   { border-color: var(--green);  color: var(--green); }
    .gate.bad  { border-color: var(--red); color: var(--red); font-weight: 600; }
    .gate.warn { border-color: var(--accent); color: var(--text2); }
    .gate-list { list-style: disc; margin: 0 0 0 var(--space-lg); font-size: var(--text-sm); color: var(--text2); max-height: 160px; overflow: auto; }
    .step-todo { display: grid; gap: var(--space-2xs); border-top: 1px solid var(--border); padding-top: var(--space-sm); }
    .step-todo h3 { font-size: var(--text-sm); font-weight: 650; }
    .todo-list { list-style: none; display: grid; gap: var(--space-2xs); }
    .todo-list .inline-chk { align-items: start; white-space: normal; font-size: var(--text-sm); color: var(--text); }
    button.linkish { height: auto; padding: 0; border: none; background: none; color: var(--accent); font-weight: 600; text-decoration: underline; }
    button.linkish:hover:not(:disabled) { background: none; }
    .deps-bar {display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-xs); margin-bottom: var(--space-md); }
    .deps-bar #deps-url { flex: 1; min-width: 240px; }
    .deps-sheet-fld { min-width: 180px; }
    .deps-sheet-fld select { width: 100%; }
    .deps-sum { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-sm); margin-bottom: var(--space-xs); font-size: var(--text-sm); }
    .deps-wrap { overflow: auto; max-height: calc(100vh - 240px); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
    .deps-table { border-collapse: collapse; width: 100%; font-size: var(--text-sm); }
    .deps-table th, .deps-table td { padding: 6px var(--space-sm); text-align: left; white-space: nowrap; border-bottom: 1px solid var(--border); }
    .deps-table th { position: sticky; top: 0; background: var(--surface2); color: var(--text2); font-size: var(--text-xs); font-weight: 650; }
    .deps-table tbody tr:last-child td { border-bottom: none; }
    .inline-chk {display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--text2); white-space: nowrap; }
  </style>
</head>
<body data-page="package">
  <main id="page">
    <div id="view"></div>
  </main>

  <script type="module" src="../shared/shell.js"></script>
  <script type="module" src="package.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="../shared/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude assistant · Backlog Monitor</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/ai-mark.css" />
  <style>
    /* Hallmark · genre: modern-minimal · page: Claude assistant (floating, embedded) · design-system: design.md
     * layout: header, a scrolling chat log, a pinned input · pre-emit critique: P4 H4 E4 S4 R5 V4 */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: clip; }
    body {
      display: flex; flex-direction: column; background: var(--bg); color: var(--text);
      font-size: var(--text-sm); line-height: 1.45;
    }

    .bar {
      display: flex; align-items: flex-start; gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md) var(--space-sm) 22px;   /* room for the resize grip in the top-left corner */
      background: var(--bg); border-bottom: 1px solid var(--border);
    }
    .bar-head { min-width: 0; flex: 1; }
    .bar-title { display: flex; align-items: center; gap: 6px; font-size: var(--text-lg); font-weight: 650; letter-spacing: -0.02em; }
    .bar-title .claude-icon { font-size: 20px; }
    .bar-ctx { color: var(--muted); font-size: var(--text-xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-actions { display: flex; align-items: center; gap: var(--space-xs); flex: none; }
    .select {
      max-width: 128px; height: 28px; padding: 0 var(--space-xs); font: inherit; font-size: var(--text-xs); font-weight: 500;
      color: var(--text); background: var(--overlay); border: 1px solid var(--border2); border-radius: var(--radius-md);
      color-scheme: var(--scheme); cursor: pointer; transition: border-color var(--dur-short) var(--ease-out);
    }
    .select:hover { border-color: var(--subtle); }
    .select:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    .close {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border: 0; border-radius: var(--radius-sm); cursor: pointer;
      background: transparent; color: var(--text2);
      transition: background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out);
    }
    .close[hidden] { display: none; }
    .close:hover { background: var(--overlay); color: var(--text); }
    .close:active { transform: translateY(1px); }
    .close:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

    main { flex: 1; min-height: 0; overflow-y: auto; padding: var(--space-md); display: grid; gap: var(--space-sm); align-content: start; }

    .ai-mark { display: inline-flex; flex: none; line-height: 1; font-size: 18px; }

    .chat-log { list-style: none; display: flex; flex-direction: column; gap: var(--space-xs); }
    .msg { max-width: 92%; padding: 7px 11px; border-radius: 12px; font-size: var(--text-sm); line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
    .msg-user { align-self: flex-end; background: var(--accent2); color: #fff; border-bottom-right-radius: 4px; }
    .msg-ai { align-self: flex-start; display: flex; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg-ai { white-space: normal; }
    .msg-ai .ai-mark { margin-top: 2px; }
    .msg-body { min-width: 0; flex: 1; display: grid; gap: 6px; }
    .msg-text { display: grid; gap: 6px; }
    .msg-text:empty { display: none; }
    .msg-text ul, .msg-text ol, .prop-md ul, .prop-md ol { padding-left: 18px; display: grid; gap: 2px; }
    .md-h { font-weight: 650; }
    .msg-text code, .prop-md code { font-family: var(--font-mono, monospace); font-size: .92em; padding: 0 4px; border-radius: 4px; background: var(--overlay); }
    .msg-text pre { overflow-x: auto; padding: 8px 10px; border-radius: var(--radius-sm); background: var(--overlay); border: 1px solid var(--border); }
    .msg-text pre code { padding: 0; background: none; white-space: pre; }
    .msg-text a { color: var(--accent); }
    .msg-ai.is-live { border-color: transparent; background: linear-gradient(var(--surface2), var(--surface2)) padding-box, linear-gradient(120deg, var(--ai-1), var(--ai-2), var(--ai-3)) border-box; }
    .msg-ai.is-live .msg-text > :last-child::after { content: ''; display: inline-block; width: 7px; height: 1.05em; margin-left: 2px; vertical-align: -2px; border-radius: 1px; background: var(--accent); animation: ai-caret 1s steps(1) infinite; }
    @keyframes ai-caret { 50% { opacity: 0; } }
    .msg-ai.is-err { border-color: var(--red); }
    .typing { display: inline-flex; gap: 4px; align-items: center; height: 1.2em; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ai-2); animation: ai-bounce 1.1s var(--ease-in-out) infinite; }
    .typing i:nth-child(2) { animation-delay: .15s; background: var(--ai-1); }
    .typing i:nth-child(3) { animation-delay: .3s; background: var(--ai-3); }
    @keyframes ai-bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }

    /* A proposed change: Claude only suggests; nothing is written until Apply. */
    .prop {
      display: grid; gap: 8px; padding: 10px; border-radius: 10px; background: var(--bg);
      border: 1px solid color-mix(in srgb, var(--claude) 45%, var(--border));
      animation: prop-in 220ms var(--ease-out) both;
    }
    .prop.is-busy { border-color: transparent; background: linear-gradient(var(--bg), var(--bg)) padding-box, linear-gradient(120deg, var(--ai-1), var(--ai-2), var(--ai-3)) border-box; }
    .prop.is-err { border-color: var(--red); color: var(--text2); }
    @keyframes prop-in { from { opacity: 0; transform: translateY(4px); } }
    .prop-head { display: flex; align-items: center; gap: 6px; font-size: var(--text-xs); font-weight: 650; color: var(--claude); }
    .prop-head .claude-icon { font-size: 13px; }
    .prop-list { list-style: none; display: grid; gap: 8px; }
    .prop-row { display: grid; gap: 2px; }
    .prop-row > ul { padding-left: 18px; }
    .prop-row.is-done .prop-k::after { content: ' ✓'; color: var(--green, var(--accent)); }
    .prop-k { font-size: var(--text-xs); color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .prop-md { display: grid; gap: 4px; max-height: 220px; overflow-y: auto; padding: 6px 8px; border-left: 2px solid var(--border2); color: var(--text2); }
    .prop-err { color: var(--red); font-size: var(--text-xs); }
    .prop-diff { display: block; overflow-wrap: anywhere; }
    .prop-diff em { font-style: normal; color: var(--muted); font-size: var(--text-xs); }
    .prop-diff s { color: var(--muted); }
    .prop-warn { display: block; color: var(--claude); font-size: var(--text-xs); }
    .prop-why { display: block; color: var(--muted); font-size: var(--text-xs); }
    .prop-row.is-bad { opacity: .75; }
    .prop-row.is-bad .prop-k::after { content: ' · skipped'; color: var(--red); }
    .prop-row.is-undone .prop-diff { text-decoration: line-through; opacity: .6; }
    /* Apply/Undo: the row being written shimmers, then its tick pops and the new value flashes once. */
    .prop-row { position: relative; border-radius: 6px; }
    .prop-row.is-run { background: linear-gradient(100deg, transparent 20%, color-mix(in srgb, var(--claude) 22%, transparent) 50%, transparent 80%) 180% 0 / 250% 100% no-repeat; animation: row-sweep 1s ease-in-out infinite; }
    .prop-row.is-run .prop-k::after { content: ' …'; color: var(--claude); }
    .prop-row.is-fresh .prop-k::after { display: inline-block; animation: tick-pop .45s cubic-bezier(.34,1.56,.64,1); }
    .prop-row.is-fresh { animation: row-flash 1s ease-out; }
    .prop-row.is-fresh .prop-diff b { animation: val-in .5s ease-out; }
    @keyframes row-sweep { to { background-position: -80% 0; } }
    @keyframes tick-pop { from { transform: scale(0); } }
    @keyframes row-flash { 0% { background: color-mix(in srgb, var(--green, var(--accent)) 28%, transparent); } 100% { background: transparent; } }
    @keyframes val-in { from { opacity: 0; transform: translateY(3px); } }
    @media (prefers-reduced-motion: reduce) { .prop-row.is-run, .prop-row.is-fresh, .prop-row.is-fresh .prop-diff b, .prop-row.is-fresh .prop-k::after { animation: none; } }

    /* What Claude looked at: one quiet line per read, ticking off as each finishes. */
    .reads { list-style: none; display: grid; gap: 2px; padding: 0; }
    .reads li { display: flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--muted); }
    .reads i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--border2); flex: none; }
    .reads li[data-st="run"] i { border-color: var(--op-blue); border-top-color: transparent; animation: rd-spin .8s linear infinite; }
    .reads li[data-st="done"] i { background: var(--green); border-color: var(--green); }
    .reads li[data-st="err"] i { background: var(--red); border-color: var(--red); }
    @keyframes rd-spin { to { transform: rotate(360deg); } }
    .prop-actions { display: flex; align-items: center; gap: 6px; }
    .prop-ok { color: var(--green, var(--accent)); font-weight: 650; font-size: var(--text-xs); }
    .prop-muted { color: var(--muted); font-size: var(--text-xs); display: inline-flex; align-items: center; gap: 6px; }
    .primary.sm, .ghost.sm { height: 28px; padding: 0 var(--space-sm); font-size: var(--text-xs); }

    .starters[hidden] { display: none; }
    .starters { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { height: 26px; padding: 0 var(--space-sm); border-radius: var(--radius-pill); font-size: var(--text-xs); }

    footer {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-xs); align-items: end;
      padding: var(--space-sm) var(--space-md); border-top: 1px solid var(--border); background: var(--bg);
    }
    footer textarea {
      width: 100%; resize: vertical; min-height: 40px; max-height: 30vh; font: inherit; font-size: var(--text-sm);
      color: var(--text); background: var(--overlay); border: 1px solid var(--border2); border-radius: var(--radius-md);
      padding: var(--space-xs) var(--space-sm); color-scheme: var(--scheme);
    }
    footer textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    .primary, .ghost {
      height: 36px; padding: 0 var(--space-md); border-radius: var(--radius-md); font: inherit; font-weight: 600; cursor: pointer;
      transition: background-color var(--dur-short) var(--ease-out), transform var(--dur-short) var(--ease-out);
    }
    .primary { background: var(--accent2); color: #fff; border: 0; }
    .primary:hover:not(:disabled) { background: var(--accent2-hover); }
    .primary:disabled { opacity: .55; cursor: default; }
    .ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border2); }
    .ghost:hover { background: var(--overlay); }
    .note { color: var(--muted); font-size: var(--text-xs); text-align: center; }

    @media (prefers-reduced-motion: reduce) {
      .msg-ai.is-live .msg-text > :last-child::after, .typing i, .prop, .reads i { animation: none; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <div class="bar-head">
      <h1 class="bar-title" id="claude-mark" data-mark="idle"></h1>
      <p class="bar-ctx" id="ctx-label">Loading…</p>
    </div>
    <div class="bar-actions">
      <select class="select" id="model" aria-label="Claude model"></select>
      <button type="button" class="close" id="close-panel" aria-label="Close the Claude assistant">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </header>
  <main>
    <ol class="chat-log" id="log" aria-live="polite"></ol>
    <div class="starters" id="starters"></div>
    <p class="note">Claude only reads and suggests. Nothing changes until you press Apply on a proposed change.</p>
  </main>
  <footer>
    <textarea id="input" rows="2" placeholder="Ask about what you're looking at… (Enter sends, Shift+Enter for a new line)" aria-label="Message to Claude"></textarea>
    <button type="button" class="primary" id="send">Send</button>
  </footer>
  <script type="module" src="assistant.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="../shared/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick settings · Backlog Monitor</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <style>
    /* Hallmark · genre: modern-minimal · page: Quick settings (Chrome side panel) · design-system: design.md
     * layout: one compact column, a row per switch · pre-emit critique: P4 H4 E4 S4 R5 V4 */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: clip; }
    body {
      min-height: 100vh; background: var(--bg); color: var(--text);
      font-size: var(--text-sm); line-height: 1.45;
    }

    .bar {
      position: sticky; top: 0; z-index: 1;
      display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md); background: var(--bg); border-bottom: 1px solid var(--border);
    }
    .bar-title { font-size: var(--text-lg); font-weight: 650; letter-spacing: -0.02em; }
    .bar a {
      color: var(--accent); font-weight: 600; text-decoration: none; white-space: nowrap;
    }
    .bar a:hover { text-decoration: underline; }
    .bar a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--radius-sm); }

    main { padding: var(--space-md); display: grid; gap: var(--space-lg); }

    .group-title {
      font-size: var(--text-xs); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--muted); margin-bottom: var(--space-2xs);
    }
    .rows {
      list-style: none; border: 1px solid var(--border); border-radius: var(--radius-lg);
      background: var(--surface); overflow: hidden;
    }
    .row {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--space-sm);
      align-items: center; padding: var(--space-sm) var(--space-md);
    }
    .row + .row { border-top: 1px solid var(--border); }
    .row .name { font-weight: 600; color: var(--text); cursor: pointer; min-width: 0; }
    .row .desc {
      grid-column: 1 / -1; color: var(--text2); font-size: var(--text-xs);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .row.off .name { color: var(--text2); }

    .segmented {
      position: relative; display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--radius-md);
      background: var(--overlay); border: 1px solid var(--border2);
    }
    /* Pinned inside the control so focusing a radio never scrolls the panel. */
    .segmented input { position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .segmented label {
      padding: var(--space-3xs) var(--space-sm); border-radius: var(--radius-sm); cursor: pointer;
      font-size: var(--text-xs); font-weight: 500; color: var(--text2); white-space: nowrap;
      transition: background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out);
    }
    .segmented label:hover { color: var(--text); }
    .segmented input:checked + label { background: var(--bg); color: var(--text); box-shadow: 0 1px 2px var(--shadow); }
    .segmented input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 1px; }

    .note { color: var(--muted); font-size: var(--text-xs); padding: var(--space-md); }

    .bar-actions { display: flex; align-items: center; gap: var(--space-xs); }
    .close {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border: 0; border-radius: var(--radius-sm); cursor: pointer;
      background: transparent; color: var(--text2);
      transition: background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out);
    }
    .close[hidden] { display: none; }
    .close:hover { background: var(--overlay); color: var(--text); }
    .close:active { transform: translateY(1px); }
    .close:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

    @media (prefers-reduced-motion: reduce) {
      .segmented label { transition-duration: 0s; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <h1 class="bar-title">Quick settings</h1>
    <div class="bar-actions">
      <a href="#" id="all-settings">All settings →</a>
      <button type="button" class="close" id="close-panel" aria-label="Close quick settings" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </header>
  <main id="groups" aria-live="polite">
    <p class="note">Loading…</p>
  </main>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>

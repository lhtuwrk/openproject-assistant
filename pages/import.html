<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backlog Monitor — Import CSV</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      min-height: 100vh;
      padding: 32px 40px;
    }

    h1 { font-size: 18px; font-weight: 700; color: #89b4fa; margin-bottom: 24px; }

    /* ── Drop zone ─────────────────────────────────────────────── */
    #drop-zone {
      border: 2px dashed #45475a;
      border-radius: 10px;
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      margin-bottom: 32px;
    }
    #drop-zone:hover,
    #drop-zone.drag-over {
      border-color: #89b4fa;
      background: #25253a;
    }
    #drop-zone p   { color: #6c7086; font-size: 14px; margin-bottom: 10px; }
    #drop-zone span { color: #89b4fa; font-size: 13px; font-weight: 600; }
    #file-input { display: none; }

    /* ── File list ─────────────────────────────────────────────── */
    #file-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 28px; }

    .file-card {
      background: #181825;
      border: 1px solid #313244;
      border-radius: 8px;
      padding: 18px 20px;
    }

    .file-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .file-name {
      font-size: 13px;
      font-weight: 600;
      color: #cba6f7;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 420px;
    }

    .btn-remove {
      background: none;
      border: none;
      color: #585b70;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
      transition: color .15s;
      flex-shrink: 0;
    }
    .btn-remove:hover { color: #f38ba8; }

    /* Fields row */
    .file-fields {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .field-group { display: flex; flex-direction: column; gap: 5px; }

    .field-label {
      font-size: 11px;
      font-weight: 600;
      color: #6c7086;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .field-input,
    .field-date {
      background: #313244;
      color: #cdd6f4;
      border: 1px solid #45475a;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 12px;
      color-scheme: dark;
    }
    .field-input { min-width: 220px; }
    .field-date  { min-width: 140px; }
    .field-input:focus,
    .field-date:focus  { outline: none; border-color: #89b4fa; }

    /* Date validation badge */
    .date-status {
      font-size: 11px;
      margin-top: 4px;
      min-height: 14px;
    }
    .date-status.ok     { color: #a6e3a1; }
    .date-status.taken  { color: #f38ba8; }
    .date-status.empty  { color: #6c7086; }

    /* Status preview chips */
    .status-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #25253a;
      border: 1px solid #45475a;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 11px;
      white-space: nowrap;
    }
    .chip-name   { color: #cdd6f4; }
    .chip-count  { color: #a6e3a1; font-weight: 700; }
    .chip-points { color: #fab387; }

    /* Error inside card */
    .parse-error { font-size: 12px; color: #f38ba8; }

    /* ── Bottom toolbar ─────────────────────────────────────────── */
    #bottom-bar {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    #btn-import-all {
      padding: 10px 24px;
      background: #a6e3a1;
      color: #1e1e2e;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
    }
    #btn-import-all:hover    { background: #94e2d5; }
    #btn-import-all:disabled { background: #313244; color: #6c7086; cursor: not-allowed; }

    #import-result {
      font-size: 13px;
      min-height: 18px;
    }
    #import-result.success { color: #a6e3a1; }
    #import-result.error   { color: #f38ba8; }
  </style>
</head>
<body>
  <h1>Import CSV</h1>

  <div id="drop-zone">
    <p>Drag &amp; drop CSV files here</p>
    <span>or click to browse</span>
    <input type="file" id="file-input" accept=".csv" multiple />
  </div>

  <div id="file-list"></div>

  <div id="bottom-bar">
    <button id="btn-import-all" disabled>Import All</button>
    <span id="import-result"></span>
  </div>

  <script src="import.js"></script>
</body>
</html>
